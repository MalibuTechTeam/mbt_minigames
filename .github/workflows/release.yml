name: Release

on:
  push:
    tags:
      - "v*.*.*"

# The recipe lives in MalibuTechTeam/mbt_template, which is public so that the
# private resources can call it too -- MalibuTechTeam is a user account, not an
# organisation, and a reusable workflow in a private repo would not be callable.
#
# It used to be 130 lines here, copied into thirteen resources and drifted: four
# generations of actions/checkout, and six workflows running with
# `permissions: write-all` to zip a folder. This one asks for contents: write.
jobs:
  release:
    uses: MalibuTechTeam/mbt_template/.github/workflows/mbt-release.yml@main
    with:
      resource: mbt_minigames
      files: "README.md config.lua fxmanifest.lua"
      dirs: "core modules"
      web: true
    permissions:
      contents: write
